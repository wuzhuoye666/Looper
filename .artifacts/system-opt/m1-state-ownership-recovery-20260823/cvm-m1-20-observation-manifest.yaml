    domain: &unknown_numeric {minimum: null, maximum: null, step: null, choices: null, log: false}
    default: null
    read: &integer_read
      command: {argv: [read-file, "{target}"], timeout_seconds: 5}
      parser: integer
      true_values: []
      false_values: []
    apply: null
    rollback: &snapshot {mode: restore-snapshot, command: null}
    activation: immediate
    risk: medium
    risk_reason: null
    dependencies: []
    preconditions: []
