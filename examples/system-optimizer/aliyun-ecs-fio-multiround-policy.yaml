schema_version: looper.system-optimization-policy/v1alpha1
id: aliyun-ecs-fio-randread-multiround-20260823
mode: general
identity:
  required_fields: [target, workload, phase, tool, statistics]
statistics:
  confidence_level: 0.95
  bootstrap_resamples: 2000
  random_seed: 20260823
  baseline_repeats: 5
  candidate_repeats: 5
  baseline_every_n: 2
search:
  generator: grid
  random_seed: 20260823
  max_candidates: 5
  max_attempts: 8
  wall_time_seconds: 1200
  no_improvement_limit: 5
  target_improvement: null
  routed_component_limit: null
  tie_break_order: [primary-lower, primary-estimate, fewer-changes, candidate-id]
safety:
  max_changes: 2
  max_changes_reason: null
  require_privileged: true
  pinned_items: []
  ownership_unknown_items: []
  high_risk_waivers: []
metrics:
  - id: fio.read-iops
    role: business-primary
    component: storage
    direction: maximize
    unit: iops
    scope: one prepared 1-GiB file on the root ext4 filesystem
    phase: steady-state random read after an explicit ramp
    aggregation: median
    minimum_samples: 5
    scale: 1
    minimum_effect: 0
    target: null
    lower_bound: null
    upper_bound: null
    pressure_method: none
    pressure_reference: null
    source: fio 3.36 JSON read.iops; reuse of the confirmed 2026-08-23 protocol
  - id: fio.read-clat-p99-us
    role: business-secondary
    component: storage
    direction: minimize
    unit: microseconds
    scope: conservative maximum per-job p99 completion latency
    phase: steady-state random read after an explicit ramp
    aggregation: median
    minimum_samples: 5
    scale: 1
    minimum_effect: 0
    target: null
    lower_bound: null
    upper_bound: null
    pressure_method: none
    pressure_reference: null
    source: fio 3.36 JSON read.clat_ns.percentile[99.000000]
  - id: fio.success
    role: hard-gate
    component: storage
    direction: diagnostic-only
    unit: boolean
    scope: all fio jobs in all repeats
    phase: complete measurement batch
    aggregation: mean
    minimum_samples: 5
    scale: null
    minimum_effect: null
    target: null
    lower_bound: null
    upper_bound: null
    pressure_method: none
    pressure_reference: null
    source: fio job error equals zero and read bytes are positive
hard_gates:
  - id: fio-execution-success
    metric: fio.success
    operator: "true"
    threshold: null
    reason: every fio job must complete successfully and read data
authorized_components: [storage]
metadata:
  evidence_kind: empirical-aliyun-ecs
  acceptance: primary 95-percent bootstrap lower bound must be strictly above zero
  tuning_daemon_disposition: tuned remains active; exclude every setting declared by virtual-guest and invalidate on observed config drift
  warning: shared one-host result; not portable to Tencent Cloud CVM
