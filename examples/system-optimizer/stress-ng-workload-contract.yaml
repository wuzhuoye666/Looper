# M3 workload 合同示例：stress-ng 作业务负载替身（SO-D020 / workload-tuning.md D0）。
#
# 边界：负载由测试侧外部启动（argv 只存在于测试侧台账与下方 description 的
# 说明里）；引擎持有 argv_digest 仅为观察窗身份核对，绝不执行。
# argv_digest 由测试侧用 looper_core.system_opt.workload.load_argv_digest 对
# 真实 argv 计算得出，双方可复现比对。
#
# O0 指标 id 必须登记在 observation.py 的 O0 解析器注册表中
# （stress-ng YAML 输出的真实字段名）。
schema_version: looper.workload-contract/v1alpha1
workload_id: stress-ng-cpu-standin-v1
load_provider: external-test
load_command:
  tool: stress-ng
  argv_digest: sha256:aa2ddd9d35b5f8054f8b7f5d3412d184b0d8ee697f6eb06779837123989c590f
  declared_duration_seconds: 120
  description: >
    stress-ng --cpu 4 --timeout 120s --yaml（argv 由测试侧持有；
    本合同只登记其身份摘要；--yaml 输出由测试侧保存后交引擎解析）
o0_metrics:
  - metric_id: stress-ng.bogo-ops-per-second-usr-sys-time
    unit: bogo-ops/s
    direction: maximize
    aggregation: mean
    source: stress-ng --yaml 输出 metrics[].bogo-ops-per-second-usr-sys-time
  - metric_id: stress-ng.bogo-ops
    unit: ops
    direction: maximize
    aggregation: mean
    source: stress-ng --yaml 输出 metrics[].bogo-ops
objective:
  primary_metric_id: stress-ng.bogo-ops-per-second-usr-sys-time
  scale: 1.0
  mde: 0.01
slos: []
correctness_gates:
  - metric_id: stress-ng.bogo-ops
    comparator: at-least
    bound: 1
    unit: ops
phases:
  - phase_id: steady
    purpose: 持续 CPU 负载阶段，O0 全量观察
    o0_metric_ids:
      - stress-ng.bogo-ops-per-second-usr-sys-time
      - stress-ng.bogo-ops
limitations: >
  单机 CPU 替身负载；bogo-ops 跨 stress-ng 版本不可比（0.17.06 实测格式）；
  本例 YAML 输出无 failed-ops 字段，正确性以 bogo-ops 至少 1（负载确实
  做了工作）与测试侧进程退出状态台账为准；结论只对声明的工具、argv
  身份与本机环境成立。
