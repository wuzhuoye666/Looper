# M3 workload 合同示例：stress-ng 作业务负载替身（SO-D020 / workload-tuning.md D0）。
#
# 边界：负载由测试侧外部启动（argv 只存在于测试侧台账与下方 description 的
# 说明里）；引擎持有 argv_digest 仅为观察窗身份核对，绝不执行。
# argv_digest 由测试侧用 looper_core.system_opt.workload.load_argv_digest 对
# 真实 argv 计算得出，双方可复现比对。
schema_version: looper.workload-contract/v1alpha1
workload_id: stress-ng-cpu-standin-v1
load_provider: external-test
load_command:
  tool: stress-ng
  argv_digest: sha256:aa2ddd9d35b5f8054f8b7f5d3412d184b0d8ee697f6eb06779837123989c590f
  declared_duration_seconds: 120
  description: >
    stress-ng --cpu 4 --timeout 120s --metrics-brief（argv 由测试侧持有；
    本合同只登记其身份摘要）
o0_metrics:
  - metric_id: stress-ng.bogo-ops
    unit: bogo-ops/s
    direction: maximize
    aggregation: mean
    source: stress-ng 结束时输出的 bogo ops/s 统计（测试侧保存原始输出）
  - metric_id: stress-ng.failed-ops
    unit: ops
    direction: minimize
    aggregation: maximum
    source: stress-ng 输出的 failed 操作计数
objective:
  primary_metric_id: stress-ng.bogo-ops
  scale: 1.0
  mde: 0.01
slos: []
correctness_gates:
  - metric_id: stress-ng.failed-ops
    comparator: at-most
    bound: 0
    unit: ops
phases:
  - phase_id: steady
    purpose: 持续 CPU 负载阶段，O0 全量观察
    o0_metric_ids:
      - stress-ng.bogo-ops
      - stress-ng.failed-ops
limitations: >
  单机 CPU 替身负载；bogo-ops 跨工具版本不可比；结论只对声明的工具、
  argv 身份与本机环境成立。
