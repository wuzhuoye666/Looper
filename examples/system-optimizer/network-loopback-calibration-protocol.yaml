schema_version: looper.standard-pressure-protocol/v1alpha1
id: network-iperf3-loopback-calibration-20260823
component: network
target_scope: Linux loopback TCP protocol stack only, two iperf3 streams on an explicit local port.
limitation: Cannot prove virtio NIC, VPC, physical network, cross-host RTT, loss, or bandwidth behavior.
required_executables: [python3]
input_identity:
  policy_id: unassigned-calibration-only
  evidence_kind: empirical-loopback-only
metric_ids: [network.receive-throughput-gbps, network.retransmits, network.success]
gate_metric_ids: [network.success]
stability:
  metric_id: network.receive-throughput-gbps
  statistic: cv
  enforcement: report-only
  acceptance_limit: null
  minimum_repeats: 7
  maximum_repeats: 7
  source: First Alibaba ECS loopback calibration contract; threshold deliberately unapproved.
phases:
  - id: prepare
    kind: prepare
    command:
      argv: [python3, examples/system-optimizer/network_pressure_measure.py, prepare, --output-dir, .artifacts/system-opt/m2-network-loopback-calibration, --repeats, "{repeats}", --host, 127.0.0.1, --port, "5203", --duration-seconds, "3", --omit-seconds, "1", --parallel-streams, "2", --server-startup-seconds, "0.2", --start-local-server, --allow-loopback]
      timeout_seconds: 15
    declared_duration_seconds: 0
    purpose: Verify Linux, iperf3, loopback authorization, and freeze all network inputs.
  - id: warmup
    kind: warmup
    command:
      argv: [python3, examples/system-optimizer/network_pressure_measure.py, warmup, --output-dir, .artifacts/system-opt/m2-network-loopback-calibration, --repeats, "{repeats}", --host, 127.0.0.1, --port, "5203", --duration-seconds, "3", --omit-seconds, "1", --parallel-streams, "2", --server-startup-seconds, "0.2", --start-local-server, --allow-loopback]
      timeout_seconds: 45
    declared_duration_seconds: 4.2
    purpose: Discard one explicit iperf3 warmup including its omit interval.
  - id: measure
    kind: measure
    command:
      argv: [python3, examples/system-optimizer/network_pressure_measure.py, measure, --output-dir, .artifacts/system-opt/m2-network-loopback-calibration, --repeats, "{repeats}", --host, 127.0.0.1, --port, "5203", --duration-seconds, "3", --omit-seconds, "1", --parallel-streams, "2", --server-startup-seconds, "0.2", --start-local-server, --allow-loopback]
      timeout_seconds: 120
    declared_duration_seconds: 29.4
    purpose: Emit receive throughput and retransmission repetitions as one MeasurementBatch.
  - id: verify
    kind: verify
    command:
      argv: [python3, examples/system-optimizer/network_pressure_measure.py, verify, --output-dir, .artifacts/system-opt/m2-network-loopback-calibration, --repeats, "{repeats}", --host, 127.0.0.1, --port, "5203", --duration-seconds, "3", --omit-seconds, "1", --parallel-streams, "2", --server-startup-seconds, "0.2", --start-local-server, --allow-loopback]
      timeout_seconds: 15
    declared_duration_seconds: 0
    purpose: Require finite positive receive throughput and the success gate.
  - id: cleanup
    kind: cleanup
    command:
      argv: [python3, examples/system-optimizer/network_pressure_measure.py, cleanup, --output-dir, .artifacts/system-opt/m2-network-loopback-calibration, --repeats, "{repeats}", --host, 127.0.0.1, --port, "5203", --duration-seconds, "3", --omit-seconds, "1", --parallel-streams, "2", --server-startup-seconds, "0.2", --start-local-server, --allow-loopback]
      timeout_seconds: 15
    declared_duration_seconds: 0
    purpose: Fail if an iperf3 pressure-process marker remains.
