apiVersion: looper.dev/v1alpha1
kind: Benchmark
metadata:
  id: looper.phoronix-phpbench
  name: Phoronix Test Suite / PHPBench
  version: 10.8.6-phpbench1.1.6-looper12
  description: "Phoronix Test Suite 10.8.6 的固定 profile 接入包。Looper 在用户选定目标后自动部署 PTS、PHP CLI、unzip 和 Adapter；producer 仅允许执行 pts/phpbench-1.1.6，保存 PTS 原始 JSON；normalizer 校验 profile、Score 单位与 HIB 方向后生成标准观测。"
  license: GPL-3.0-or-later
  source:
    url: https://github.com/phoronix-test-suite/phoronix-test-suite
    commit: f977d6e270d5eb9eebfa26d3ca62385c00a547a6
spec:
  trust: trusted
  capabilities: [python, local-process, phoronix-test-suite, php-cli, unzip]
  parameters:
    times_to_run:
      type: integer
      minimum: 1
      maximum: 10
      default: 3
      description: Number of raw PHPBench repetitions requested through FORCE_TIMES_TO_RUN.
    test_timeout_minutes:
      type: integer
      minimum: 2
      maximum: 30
      default: 10
      description: Per-test timeout requested through TEST_TIMEOUT_AFTER.
  workloads:
    - id: phpbench
      name: PHPBench 0.8.1
      metadata:
        profile: pts/phpbench-1.1.6
        profileVersion: 1.1.6
        resultHash: 946f5e0360cf178c425ab9080de3597a148b632b
        resultScale: Score
        resultProportion: HIB
        payloadSha256: 32503bd4ace0c8429493de864ca48bb16febed867e52b75f4369d7145f797718
  scenario:
    id: microbenchmark.phoronix.phpbench
    name: Phoronix PHP interpreter microbenchmark
    decision_question: Which target environment delivers the higher PHPBench score under a pinned PTS profile and repeat policy?
    user_value: Compare PHP interpreter and single-node CPU execution performance with a small, portable benchmark.
    workload_class: microbenchmark
    topology: single-node
    roles:
      - id: target
        kind: target
        included_in_score: true
        description: Machine and PHP runtime being measured
      - id: benchmark-runner
        kind: load-generator
        co_located_with: target
        included_in_score: true
        description: PTS and PHPBench process co-located with the target
    primary_metric: phpbench_score
    slo_gates:
      - id: pts-execution
        kind: correctness
        scope: block
        metric: pts_run_ok
        operator: eq
        threshold: 1
        hard: true
      - id: profile-contract
        kind: correctness
        scope: block
        metric: profile_version_match
        operator: eq
        threshold: 1
        hard: true
      - id: positive-score
        kind: slo
        scope: block
        metric: phpbench_score
        operator: gt
        threshold: 0
        hard: true
    goodput:
      metric: phpbench_score
      unit: Score
      committed_outcome: successful
      excluded_outcomes: [error, timeout]
      maximum_error_ratio: 0
      maximum_timeout_ratio: 0
  infrastructure:
    orchestration: adapter
    primaryNodeGroup: target
    nodeGroups:
      - id: target
        role: target
        count: {minimum: 1, default: 1, maximum: 1}
        includedInScore: true
        requirements:
          osFamilies: [linux]
          architectures: [x86_64, aarch64]
          capabilities: [python, local-process, linux]
          cpu: {minimumLogicalCpus: 1}
          software:
            - {name: Phoronix Test Suite, versionConstraint: "==10.8.6"}
            - {name: PHP CLI, versionConstraint: ">=8.0,<9.0"}
            - {name: unzip, versionConstraint: available}
        placement:
          sameZone: true
          dedicated: true
    notes: "当前 pilot 只覆盖 Linux 单机 PHPBench；PTS 其它 profile 的拓扑、依赖和指标合同必须独立审计。"
  adapter:
    protocol: looper-adapter/v1
    executionModel: batch-suite
    primaryMetric: phpbench_score
    requiredChecks: [pts-run-ok, profile-contract-match]
    inputs: []
    canonicalOutputs:
      metrics: metrics.jsonl
      result: result.json
  runtime:
    type: local-process
    workingDirectory: .
    dependencyLockDigest: sha256:63f32c14ba20dd7401202945c983dbe0005af4315d4537a690f24c4da941a6bd
    provisioning:
      mode: managed
      hostCapabilities: [python, local-process, linux]
      provides: [phoronix-test-suite, php-cli, unzip]
      cacheKey: sha256:63f32c14ba20dd7401202945c983dbe0005af4315d4537a690f24c4da941a6bd
      requiresNetwork: true
      privilege: sudo
    dependencies:
      - id: phoronix-test-suite
        source: https://github.com/phoronix-test-suite/phoronix-test-suite/archive/f977d6e270d5eb9eebfa26d3ca62385c00a547a6.zip
        digest: sha256:9d4b811a1ff4710ac89d19b34ba7ef4188b8ce1bfe61d5d276b0ee689dba1dc4
        license: GPL-3.0-or-later
      - id: phpbench-payload
        source: bundled:phpbench-081-patched2.zip
        digest: sha256:32503bd4ace0c8429493de864ca48bb16febed867e52b75f4369d7145f797718
        license: upstream-Free
    commands:
      prepare:
        argv: ["{python}", "{benchmarkRoot}/prepare.py", "--cache", "{cache}"]
        timeoutSeconds: 900
        allowedExitCodes: [0]
      run:
        argv: ["{python}", "{benchmarkRoot}/producer.py", "--envelope", "{envelope}", "--output", "{output}"]
        timeoutSeconds: 2400
        allowedExitCodes: [0]
        environment:
          LOOPER_PTS_BIN: "{cache}/phoronix-test-suite/phoronix-test-suite"
          LOOPER_PHP_BIN: "{cache}/bin/php"
          LOOPER_PHPBENCH_PAYLOAD: "{cache}/phpbench-081-patched2.zip"
          LOOPER_PTS_USER_PATH: "{cache}/pts-user"
      normalize:
        argv: ["{python}", "{benchmarkRoot}/normalizer.py", "--envelope", "{envelope}", "--output", "{output}"]
        timeoutSeconds: 60
        allowedExitCodes: [0]
  metrics:
    phpbench_score:
      unit: Score
      direction: maximize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Aggregate score exported by the pinned PTS PHPBench profile.
      presentation:
        userLabel: PHPBench 综合分数
        userDescription: 固定 PTS PHPBench profile 导出的聚合分数，数值越高表示 PHP 执行性能越好。
        roles: [primary_outcome]
        defaultVisibility: summary
        displayFormat: number
        displayPrecision: 0
    phpbench_score_sample:
      unit: Score
      direction: maximize
      kind: sample
      minimumSamples: 1
      description: Raw score retained from each PTS repetition.
      presentation:
        userLabel: 单次重复分数
        userDescription: FORCE_TIMES_TO_RUN 控制的每次原始 PHPBench 分数，用于检查波动和聚合结果。
        roles: [stability]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 0
    sample_count:
      unit: count
      direction: none
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: 有效样本数
        roles: [context]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 0
    pts_run_ok:
      unit: flag
      direction: maximize
      kind: boolean
      minimumSamples: 1
      presentation:
        userLabel: PTS 执行成功
        roles: [hard_gate]
        defaultVisibility: detail
        displayFormat: boolean
    profile_version_match:
      unit: flag
      direction: maximize
      kind: boolean
      minimumSamples: 1
      presentation:
        userLabel: Profile 版本匹配
        roles: [hard_gate]
        defaultVisibility: detail
        displayFormat: boolean
  outputs:
    maxBytes: 8388608
    maxMetricLines: 32
    artifacts:
      - path: pts-result.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: run-metadata.json
        role: profile
        mediaType: application/json
        required: true
      - path: result.json
        role: result
        mediaType: application/json
        required: true
      - path: adapter.log
        role: log
        mediaType: text/plain
        required: true
  audit:
    minimumRepeats: 3
    referencePolicy: required
    environmentAxes: [machine, day, runtime]
    requiredEvidence: [system-fingerprint, raw-result, profile, log]
  x-extensions:
    bootstrapCatalog: true
    executionStatus: executable
    selectionDefaults: {repeats: 3, timeoutSeconds: 10800, seed: 20260302}
    diagnosticRecommendations:
      enabled: true
      policy:
        minimumSamples: 3
        cvStable: 0.05
        cvUnstable: 0.15
        slowShareUnstable: 0.30
        outlierFenceK: 1.5
        modeMinimumSamples: 8
        modeMinR2: 0.5
        modeMinClusterShare: 0.10
        modeGapRatio: 2.5
        skewThreshold: 1.0
        associationMinCorrelation: 0.3
        associationMinLift: 1.2
        attributionMinEtaSquared: 0.25
      rules:
        - {id: phpbench.stable, scope: group, when: stable, priority: low, kind: diagnostic, action: 当前 PHPBench 综合分数稳定，可保持 PTS profile 与运行时配置复测。, rationale: 通过门禁的原始分数 CV 低于合同稳定阈值。}
        - {id: phpbench.warning, scope: group, when: warning, priority: medium, kind: retest, action: 保持 profile 和 PHP 运行时不变并增加重复次数。, rationale: PHPBench 分数出现波动、偏度或异常轮次。}
        - {id: phpbench.unstable, scope: group, when: unstable, priority: high, kind: retest, action: 固定 PHP 运行时、CPU 频率并隔离后台进程后重测。, rationale: 综合分数 CV 或慢轮次占比超过合同阈值。}
        - {id: phpbench.samples, scope: group, when: insufficient_evidence, priority: high, kind: retest, action: 将通过 PTS 与 Profile 门禁的有效轮次补足到至少 3 次。, rationale: 当前有效综合分数样本不足。}
        - {id: phpbench.outlier, scope: group, when: outlier_present, priority: medium, kind: diagnostic, action: 对照 pts-result.json、运行元数据和终端输出检查异常轮次。, rationale: 原始 PHPBench 分数存在 IQR 异常值。}
        - {id: phpbench.multimodal, scope: group, when: multimodal, priority: high, kind: retest, action: 固定 PHP runtime 与 CPU 状态后分组复测。, rationale: 至少 8 个有效样本呈现疑似快慢双模式。}
        - {id: phpbench.system-metrics, scope: group, when: missing_system_metrics, priority: medium, kind: data_collection, action: 补充 CPU 频率、上下文切换和运行队列指标。, rationale: 当前证据不足以解释 PHP 运行时波动。}
        - {id: phpbench.gates, scope: group, when: gate_failure, priority: high, kind: diagnostic, action: 先修复 PTS 执行或 Profile 版本门禁，再补充有效轮次。, rationale: 未通过必要门禁的轮次已从综合分数统计中排除。}
        - {id: phpbench.single-target, scope: study, when: single_target, priority: medium, kind: retest, action: 如需比较环境，请使用相同 PTS profile 增加目标机。, rationale: 单目标只能诊断分数稳定性，不形成性能优劣或采购结论。}
        - {id: phpbench.no-comparison, scope: study, when: no_comparison, priority: low, kind: diagnostic, action: 当前报告不输出运行环境排名。, rationale: 缺少可比较目标或有效成对证据。}
    resultPresentation:
      sections:
        - id: phpbench-results
          label: PHPBench 数据
          view: phpbench-results
          description: 展示固定 PTS profile 的综合分数、重复样本、执行参数、协议门禁和原始证据状态。
          metrics: [phpbench_score, phpbench_score_sample, sample_count, pts_run_ok, profile_version_match]
