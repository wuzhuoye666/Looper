apiVersion: looper.dev/v1alpha1
kind: Benchmark
metadata:
  id: looper.sysbench
  name: Sysbench
  version: 1.0.2
  description: "Sysbench 1.0.20 通用系统性能套件：选择目标机器后由 Looper 自动下发 Adapter、构建或复用固定版本，再运行 CPU、内存、线程调度与互斥锁测试。"
  license: GPL-2.0
  source:
    url: https://github.com/akopytov/sysbench
    commit: ebf1c90da05dea94648165e4f149abc20c979557
    digest: sha256:2a664cb397ebb0678a91d7b876c1ffcebe728a52cbb1ffe0aa63b36fad1c9e1c
spec:
  trust: trusted
  capabilities: [python, local-process, linux, sysbench]
  parameters:
    threads:
      type: integer
      minimum: 1
      maximum: 256
      default: 4
    time:
      type: integer
      minimum: 5
      maximum: 300
      default: 10
  workloads:
    - id: cpu
      name: CPU prime
      metadata:
        test: cpu
        extraArgs: []
      metrics:
        events_per_sec:
          presentation:
            roles: [primary_outcome]
            defaultVisibility: summary
    - id: memory
      name: Memory throughput
      metadata:
        test: memory
        extraArgs: ["--memory-block-size=1K", "--memory-total-size=100G"]
      metrics:
        throughput_mib_s:
          presentation:
            roles: [primary_outcome]
            defaultVisibility: summary
    - id: thread
      name: Thread scheduling
      metadata:
        test: thread
        extraArgs: []
      metrics:
        events_per_sec:
          presentation:
            roles: [primary_outcome]
            defaultVisibility: summary
    - id: mutex
      name: Mutex contention
      metadata:
        test: mutex
        extraArgs: ["--mutex-num=4096", "--mutex-locks=100000"]
      metrics:
        events_per_sec:
          presentation:
            roles: [primary_outcome]
            defaultVisibility: summary
  scenario:
    id: microbenchmark.sysbench.suite
    name: Sysbench microbenchmark suite
    decision_question: Which target SKU delivers better CPU throughput, memory bandwidth, thread scheduling, and mutex contention performance under controlled microbenchmark conditions?
    user_value: Characterize raw system performance across CPU, memory, threading, and synchronization primitives without application-layer overhead.
    workload_class: microbenchmark
    topology: single-node
    roles:
      - id: target
        kind: target
        included_in_score: true
        description: Target machine under benchmark
      - id: benchmark-runner
        kind: load-generator
        co_located_with: target
        included_in_score: true
        description: Local sysbench binary co-located with target
    primary_metric: events_per_sec
    slo_gates:
      - id: sysbench-execution
        kind: correctness
        scope: block
        metric: sysbench_run_ok
        operator: eq
        threshold: 1
        hard: true
      - id: minimum-events
        kind: slo
        scope: block
        metric: events_per_sec
        operator: gt
        threshold: 0
        hard: true
    goodput:
      metric: events_per_sec
      unit: events/second
      committed_outcome: successful
      excluded_outcomes: [error, timeout]
      maximum_error_ratio: 0
      maximum_abort_ratio: 0
      maximum_timeout_ratio: 0
    tail_evidence:
      metric: latency_p95_ms
      unit: ms
      minimum_samples: 100
      required_statistics: [p95, maximum]
      histogram_format: upstream-summary
      timeout_accounting: separate
  infrastructure:
    orchestration: adapter
    primaryNodeGroup: target
    nodeGroups:
      - id: target
        role: target
        count: {minimum: 1, default: 1, maximum: 1}
        includedInScore: true
        requirements:
          osFamilies: [linux]
          capabilities: [python, local-process, linux]
          cpu: {minimumLogicalCpus: 1}
          software:
            - name: sysbench
              versionConstraint: "==1.0.20"
        placement:
          sameZone: true
          dedicated: true
  adapter:
    protocol: looper-adapter/v1
    executionModel: batch-suite
    primaryMetric: events_per_sec
    requiredChecks: [sysbench-run-ok]
    inputs: []
    canonicalOutputs:
      metrics: metrics.jsonl
      result: result.json
  runtime:
    type: local-process
    workingDirectory: .
    dependencyLockDigest: "sha256:f35a2d54055b15526be976706666d20c2ed9251b5179aca9849c31a0a0522ddf"
    dependencies:
      - id: sysbench-1.0.20-source
        source: https://codeload.github.com/akopytov/sysbench/tar.gz/ebf1c90da05dea94648165e4f149abc20c979557
        digest: sha256:2a664cb397ebb0678a91d7b876c1ffcebe728a52cbb1ffe0aa63b36fad1c9e1c
        license: GPL-2.0
    provisioning:
      mode: managed
      hostCapabilities: [python, local-process, linux]
      provides: [sysbench]
      cacheKey: "sha256:f35a2d54055b15526be976706666d20c2ed9251b5179aca9849c31a0a0522ddf"
      requiresNetwork: true
      privilege: sudo
    commands:
      prepare:
        argv: ["{python}", "{benchmarkRoot}/prepare.py", "--benchmark-root", "{benchmarkRoot}", "--cache", "{cache}"]
        timeoutSeconds: 900
        allowedExitCodes: [0]
      run:
        argv: ["{python}", "{benchmarkRoot}/producer.py", "--envelope", "{envelope}", "--output", "{output}", "--cache", "{cache}"]
        timeoutSeconds: 360
        allowedExitCodes: [0]
      normalize:
        argv: ["{python}", "{benchmarkRoot}/normalizer.py", "--envelope", "{envelope}", "--output", "{output}"]
        timeoutSeconds: 60
        allowedExitCodes: [0]
  metrics:
    events_per_sec:
      unit: events/s
      direction: maximize
      kind: aggregate
      required: true
      minimumSamples: 1
      presentation:
        userLabel: 每秒事件数
        userDescription: 单位时间完成的事件数量，是 CPU、线程与互斥负载下的主结果。
        roles: [primary_outcome]
        defaultVisibility: summary
        displayFormat: throughput
        displayPrecision: 2
    latency_avg_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: 平均延迟
        userDescription: 事件处理的平均耗时，用于监督吞吐提升未以延迟恶化为代价。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    latency_p95_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: P95 延迟
        userDescription: 事件处理的 P95 耗时，是尾延迟保护指标。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    latency_max_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: 最大延迟
        userDescription: 事件处理的最大耗时，仅用于问题定位。
        roles: [diagnostic]
        defaultVisibility: expert
        displayFormat: duration
        displayPrecision: 2
    throughput_mib_s:
      unit: MiB/s
      direction: maximize
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: 内存吞吐量
        userDescription: 内存带宽结果，仅在 memory 负载下作为主结果；其它负载中无业务含义。
        roles: [context]
        defaultVisibility: detail
        displayFormat: throughput
        displayPrecision: 2
    sysbench_run_ok:
      unit: flag
      direction: maximize
      kind: aggregate
      minimumSamples: 1
      presentation:
        userLabel: 运行成功标志
        userDescription: sysbench 是否正常结束并产出有效结果，必须为真。
        roles: [hard_gate]
        defaultVisibility: hidden
        displayFormat: boolean
  outputs:
    maxBytes: 4194304
    maxMetricLines: 20
    artifacts:
      - path: raw-result.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: result.json
        role: result
        mediaType: application/json
        required: true
      - path: adapter.log
        role: log
        mediaType: text/plain
        required: true
  audit:
    minimumRepeats: 5
    referencePolicy: required
    environmentAxes: [machine, day]
    requiredEvidence: [system-fingerprint, raw-result, log]
  x-extensions:
    bootstrapCatalog: true
    executionStatus: executable
    selectionDefaults: {repeats: 5, timeoutSeconds: 3600, seed: 20260301}
    diagnosticRecommendations:
      enabled: true
      policy:
        minimumSamples: 5
        cvStable: 0.05
        cvUnstable: 0.15
        slowShareUnstable: 0.30
        outlierFenceK: 1.5
        modeMinimumSamples: 8
        modeMinR2: 0.5
        modeMinClusterShare: 0.10
        modeGapRatio: 2.5
        skewThreshold: 1.0
        associationMinCorrelation: 0.3
        associationMinLift: 1.2
        attributionMinEtaSquared: 0.25
      rules:
        - {id: sysbench.stable, scope: group, when: stable, priority: low, kind: diagnostic, action: 当前 workload 的重复结果稳定，可保持同一参数继续复测。, rationale: 有效轮次的变异系数低于 Sysbench 合同稳定阈值。}
        - {id: sysbench.warning, scope: group, when: warning, priority: medium, kind: retest, action: 在相同线程数和时长下增加重复次数，并检查异常轮次。, rationale: 原始 Sysbench 主指标出现波动、偏度或异常样本。}
        - {id: sysbench.unstable, scope: group, when: unstable, priority: high, kind: retest, action: 固定 CPU 频率、绑核并隔离后台负载后重新采集。, rationale: 主指标变异系数或慢轮次占比超过合同不稳定阈值。}
        - {id: sysbench.samples, scope: group, when: insufficient_evidence, priority: high, kind: retest, action: 将该 workload 的有效重复次数补足到至少 5 次。, rationale: 当前有效样本不足以区分真实波动和偶然噪声。}
        - {id: sysbench.outlier, scope: group, when: outlier_present, priority: medium, kind: diagnostic, action: 对照原始终端和系统指纹排查异常轮次。, rationale: IQR 规则在原始 Benchmark 轮次中检测到异常值。}
        - {id: sysbench.multimodal, scope: group, when: multimodal, priority: high, kind: retest, action: 分别固定 CPU affinity、NUMA 和频率做控制变量复测。, rationale: 至少 8 个有效样本呈现疑似快慢双模式。}
        - {id: sysbench.system-metrics, scope: group, when: missing_system_metrics, priority: medium, kind: data_collection, action: 复测时补充 CPU 频率、迁移、上下文切换和 NUMA 指标。, rationale: 当前证据缺少解释性能波动所需的系统指标。}
        - {id: sysbench.gates, scope: group, when: gate_failure, priority: high, kind: diagnostic, action: 先处理失败轮次的执行门禁，再补充有效样本。, rationale: 存在执行失败或未通过 Sysbench 必要门禁的轮次，这些轮次未进入统计。}
        - {id: sysbench.single-target, scope: study, when: single_target, priority: medium, kind: retest, action: 如需比较机型，请用相同合同增加至少一台目标机复测。, rationale: 当前只有一台目标机，只能诊断稳定性，不能形成性能优劣或采购结论。}
        - {id: sysbench.no-comparison, scope: study, when: no_comparison, priority: low, kind: diagnostic, action: 当前报告不输出候选机型排名。, rationale: 缺少可比较目标或同 workload 的有效成对证据。}
    resultPresentation:
      sections:
        - id: sysbench-workloads
          label: Sysbench workload 数据
          view: sysbench-workloads
          description: 按 CPU、内存、线程和互斥锁 workload 展示原始采集指标与执行状态。
          metrics: [events_per_sec, throughput_mib_s, latency_avg_ms, latency_p95_ms, latency_max_ms, sysbench_run_ok]
