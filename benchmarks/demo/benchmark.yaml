apiVersion: looper.dev/v1alpha1
kind: Benchmark
metadata:
  id: looper.demo.compression
  name: Deterministic compression loop
  version: 1.0.0
  description: Searches zlib level and chunk size with a round-trip correctness gate.
  license: INTERNAL
spec:
  trust: trusted
  capabilities:
    - python
    - local-process
  parameters:
    compression_level:
      type: integer
      minimum: 1
      maximum: 9
      step: 1
      default: 6
      description: zlib compression level
    chunk_size:
      type: categorical
      choices: [4096, 16384, 65536]
      default: 16384
      description: bytes supplied to the compressor per update
  workloads:
    - id: small
      name: 128 KiB payload
      weight: 1
      metadata:
        size_kib: 128
        samples: 24
    - id: medium
      name: 512 KiB payload
      weight: 2
      metadata:
        size_kib: 512
        samples: 24
    - id: large
      name: 2 MiB payload
      weight: 1
      metadata:
        size_kib: 2048
        samples: 16
  runtime:
    type: local-process
    workingDirectory: .
    commands:
      run:
        argv:
          - "{python}"
          - "{benchmarkRoot}/compression_benchmark.py"
          - --envelope
          - "{envelope}"
          - --output
          - "{output}"
        timeoutSeconds: 120
        allowedExitCodes: [0]
  metrics:
    throughput_mib_s:
      unit: MiB/s
      direction: maximize
      kind: sample
      required: true
      minimumSamples: 3
      presentation:
        userLabel: 吞吐量
        userDescription: 每秒处理的压缩数据量，越高越好，是选择压缩参数时的主结果。
        roles: [primary_outcome]
        defaultVisibility: summary
        displayFormat: throughput
        displayPrecision: 2
    latency_ms:
      unit: ms
      direction: minimize
      kind: sample
      required: true
      minimumSamples: 3
      presentation:
        userLabel: 处理延迟
        userDescription: 单次压缩处理耗时，用于确保吞吐提升不以延迟剧增为代价。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    compression_ratio:
      unit: ratio
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      presentation:
        userLabel: 压缩率
        userDescription: 压缩产物与原始数据的大小比值，数值越小压缩越强，是吞吐优化的保护指标。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 4
    roundtrip_ok:
      unit: bool
      direction: none
      kind: boolean
      required: true
      minimumSamples: 1
      presentation:
        userLabel: 往返校验
        userDescription: 压缩后能否无损还原原始数据，必须为真，否则本次结果无效。
        roles: [hard_gate]
        defaultVisibility: hidden
        displayFormat: boolean
    output_bytes:
      unit: bytes
      direction: minimize
      kind: counter
      required: false
      minimumSamples: 1
      presentation:
        userLabel: 输出字节数
        userDescription: 压缩产物体积，用于问题定位与成本估算，不代表用户收益。
        roles: [diagnostic]
        defaultVisibility: expert
        displayFormat: bytes
        displayPrecision: 0
  outputs:
    maxBytes: 16777216
    maxMetricLines: 1000
    artifacts:
      - path: result.json
        role: result
        mediaType: application/json
        required: true
      - path: benchmark.log
        role: log
        mediaType: text/plain
        required: true
  x-extensions:
    bootstrapCatalog: true
    postBenchmarkActions:
      - id: larger-compression-chunks
        label: 增大压缩分块并复测
        description: 只调整一个低风险 Benchmark 参数，检查吞吐是否提升且压缩率不明显退化。
        risk: low
        applyMode: benchmark-parameter
        parameter: chunk_size
        value: 65536
        minimumImprovementRatio: 0.05
        guardMetric: compression_ratio
        maximumGuardRegressionRatio: 0.02
      - id: fast-compression-level
        label: 降低压缩级别并复测
        description: 以更宽松的压缩率换取吞吐，用保护指标限制质量退化。
        risk: low
        applyMode: benchmark-parameter
        parameter: compression_level
        value: 1
        minimumImprovementRatio: 0.10
        guardMetric: compression_ratio
        maximumGuardRegressionRatio: 0.15
