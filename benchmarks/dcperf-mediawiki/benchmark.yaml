apiVersion: looper.dev/v1alpha1
kind: Benchmark
metadata:
  id: dcperf.mediawiki.closed-loop
  name: DCPerf MediaWiki Closed-Loop
  version: 2026.08-pilot20
  description: Pinned single-node DCPerf MediaWiki closed-loop capacity workload with resumable managed Ubuntu 22.04/24.04 provisioning and native Benchpress evidence.
  license: MIT
  source:
    url: https://github.com/facebookresearch/DCPerf
    commit: 9308c3e3c404e0466f0a2929f15ddcf62b2215f6
spec:
  trust: trusted
  capabilities: [linux, x86_64, python, local-process, dcperf-mediawiki, systemd, ubuntu, root, perf]
  parameters:
    duration_seconds:
      type: integer
      minimum: 45
      maximum: 3600
      step: 15
      default: 900
      description: Native wrk measurement duration in seconds.
    timeout_seconds:
      type: integer
      minimum: 46
      maximum: 7200
      step: 15
      default: 960
      description: Client deadline passed to the patched oss-performance workload.
    scale_out:
      type: integer
      minimum: 1
      maximum: 8
      step: 1
      default: 1
      description: Number of co-located HHVM instances.
    client_threads:
      type: integer
      minimum: 1
      maximum: 4096
      step: 1
      default: 16
      description: wrk client threads; default follows the pinned 2x logical-CPU rule for the registered target.
    profile:
      type: boolean
      default: true
      description: Enable the pinned DCPerf perf-record hook.
  workloads:
    - id: oss_performance_mediawiki_mlp
      name: MediaWiki MLP with wrk
      weight: 1
      metadata:
        load_generator: wrk
        duration: 15m
        scale_out: 1
        client_threads_formula: 2x-logical-cpus
        native_reporter: Benchpress JSON reporter
  scenario:
    id: web.mediawiki.closed-loop
    name: MediaWiki single-node closed-loop capacity
    decision_question: How many successful full-stack MediaWiki requests can each concrete target SKU complete when every workload component shares one VM?
    user_value: Compare target SKUs under a production-inspired Web stack while disclosing that the load generator and services share one host.
    workload_class: web-full-stack
    topology: closed-loop
    roles:
      - id: target
        kind: target
        included_in_score: true
        description: Host CPU and memory under test.
      - id: load-generator
        kind: load-generator
        co_located_with: target
        included_in_score: true
        description: Pinned wrk client included in the closed-loop score.
      - id: web-service
        kind: service
        co_located_with: target
        included_in_score: true
        description: nginx and HHVM serving the bundled MediaWiki workload.
      - id: database
        kind: database
        co_located_with: target
        included_in_score: true
        description: MariaDB and memcached state.
    primary_metric: closed_loop_successful_rps
    slo_gates:
      - id: request-accounting
        kind: correctness
        scope: block
        metric: failed_request_ratio
        operator: lt
        threshold: 0.01
        hard: true
        message: Failed requests must stay below one percent.
      - id: timeout-budget
        kind: slo
        scope: block
        metric: timeout_ratio
        operator: lte
        threshold: 0.001
        hard: true
        message: Timeout requests must remain within the closed-loop budget.
      - id: cpu-saturation
        kind: resource
        scope: block
        metric: cpu_utilization_p95
        operator: gte
        threshold: 90
        hard: true
        message: The target must reach the DCPerf saturation floor.
    goodput:
      metric: closed_loop_successful_rps
      unit: requests/second
      committed_outcome: successful
      excluded_outcomes: [timeout, error, retry]
      maximum_error_ratio: 0.01
      maximum_abort_ratio: 0
      maximum_timeout_ratio: 0.001
    tail_evidence:
      metric: nginx_request_latency
      unit: ms
      minimum_samples: 100000
      required_statistics: [p50, p95, p99, timeout]
      histogram_format: upstream-summary
      timeout_accounting: separate
  infrastructure:
    orchestration: adapter
    primaryNodeGroup: target
    nodeGroups:
      - id: target
        role: target
        count: {minimum: 1, default: 1, maximum: 1}
        includedInScore: true
        requirements:
          osFamilies: [linux]
          architectures: [x86_64]
          capabilities: [dcperf-mediawiki, systemd, ubuntu]
          privileges: [root, perf, systemd]
          software:
            - name: python
              versionConstraint: ">=3.10"
        placement:
          sameZone: true
          dedicated: true
  adapter:
    protocol: looper-adapter/v1
    executionModel: service-stack
    primaryMetric: closed_loop_successful_rps
    requiredChecks: [native-identity, request-accounting, failure-budget, timeout-budget, tail-sample-count, cpu-saturation]
    inputs: []
    canonicalOutputs:
      metrics: metrics.jsonl
      result: result.json
  runtime:
    type: local-process
    workingDirectory: .
    dependencyLockDigest: sha256:1c52ec4d7a403b9e02422133dc555648312adcfa4532748d93b26091d0f18635
    dependencies:
      - id: dcperf-source
        source: https://api.github.com/repos/facebookresearch/DCPerf/tarball/9308c3e3c404e0466f0a2929f15ddcf62b2215f6
        digest: sha256:acdc2ad0b0f03adf44bf6803abe9e7880be7c61847c7caa51c41d55a96a62371
        license: MIT
      - id: oss-performance-source
        source: https://codeload.github.com/hhvm/oss-performance/tar.gz/1e0a98c987c73b4b70903469456aefdaec5ff96c
        digest: sha256:7a2a4934b2cb56fb2827521241368734d155b7de91eced28d589fea41e532313
        license: MIT
      - id: hhvm-3.30
        source: https://github.com/facebookresearch/DCPerf/releases/download/hhvm/hhvm-3.30-multplatform-binary-ubuntu.tar.xz
        digest: sha256:2159af71df4ffaf96b5d9f63d30fd6936685558ca9546c936ccb17ad86b9e0cb
        license: PHP-3.01
      - id: wrk-4.2.0
        source: https://codeload.github.com/wg/wrk/tar.gz/a211dd5a7050b1f9e8a9870b95513060e72ac4a0
        digest: sha256:172dd2788b22b210d37a68f11c91e82fdba6583d2a544f04b398a66507031229
        license: Apache-2.0
      - id: memcached-1.5.12
        source: https://codeload.github.com/memcached/memcached/tar.gz/4ba54fd8f81643ffc64bc5ba87ec5da42ea208cb
        digest: sha256:61424866fa81e464c5652a80758c9be7311c12b88ccbc951f9b1c5be82dfc8b6
        license: BSD-3-Clause
      - id: composer-2.2.24
        source: https://getcomposer.org/download/2.2.24/composer.phar
        digest: sha256:b0c383b1f430a80a74c006f20199d1e0226848a0a90afa5c0a7d01fb90ee9075
        license: MIT
    provisioning:
      mode: managed
      hostCapabilities: [linux, x86_64, python, local-process, systemd, ubuntu, root]
      provides: [dcperf-mediawiki, hhvm-3.30, mediawiki-1.28, wrk-4.2.0, memcached-1.5.12, composer-2.2.24, perf]
      cacheKey: sha256:1c52ec4d7a403b9e02422133dc555648312adcfa4532748d93b26091d0f18635
      requiresNetwork: true
      privilege: sudo
    commands:
      prepare:
        argv: ["{python}", "{benchmarkRoot}/prepare.py", "--benchmark-root", "{benchmarkRoot}", "--cache", "{cache}"]
        timeoutSeconds: 21600
        allowedExitCodes: [0]
      run:
        argv: ["{python}", "{benchmarkRoot}/producer.py", "--envelope", "{envelope}", "--output", "{output}", "--cache", "{cache}"]
        timeoutSeconds: 7500
        allowedExitCodes: [0]
      normalize:
        argv: ["{python}", "{benchmarkRoot}/normalizer.py", "--envelope", "{envelope}", "--output", "{output}"]
        timeoutSeconds: 120
        allowedExitCodes: [0]
      validate:
        argv: ["{python}", "{benchmarkRoot}/validate.py", "--output", "{output}"]
        timeoutSeconds: 120
        allowedExitCodes: [0]
      cleanup:
        argv: ["{python}", "{benchmarkRoot}/cleanup.py", "--cache", "{cache}", "--output", "{output}"]
        timeoutSeconds: 300
        allowedExitCodes: [0]
  metrics:
    closed_loop_successful_rps:
      unit: requests/second
      direction: maximize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Successful full-stack requests per second, excluding failed and timed-out requests.
      presentation:
        userLabel: 成功请求率
        userDescription: 每秒成功完成的全栈 MediaWiki 请求数，是本套件的主结果。
        roles: [primary_outcome]
        defaultVisibility: summary
        displayFormat: throughput
        displayPrecision: 2
    wrk_rps:
      unit: requests/second
      direction: none
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Request rate reported by the native wrk reporter.
      presentation:
        userLabel: 客户端施加速率
        userDescription: wrk 实际施加的请求速率，用于解释负载条件。
        roles: [context]
        defaultVisibility: detail
        displayFormat: throughput
        displayPrecision: 2
    successful_requests:
      unit: requests
      direction: maximize
      kind: counter
      required: true
      minimumSamples: 1
      description: Successful requests committed during the native measurement window.
      presentation:
        userLabel: 成功请求数
        userDescription: 测量窗口内成功完成的请求总数。
        roles: [context]
        defaultVisibility: expert
        displayFormat: number
        displayPrecision: 0
    failed_request_ratio:
      unit: ratio
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Failed requests divided by all wrk requests.
      presentation:
        userLabel: 失败请求率
        userDescription: 失败请求占比，超过百分之一即使本次结果无效。
        roles: [hard_gate]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 4
    error_ratio:
      unit: ratio
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Non-timeout errors divided by all wrk requests.
      presentation:
        userLabel: 错误率
        userDescription: 排除超时后的错误请求占比。
        roles: [diagnostic]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 4
    timeout_count:
      unit: requests
      direction: minimize
      kind: counter
      required: true
      minimumSamples: 1
      description: Timeout requests accounted for through native Nginx 499 metrics.
      presentation:
        userLabel: 超时请求数
        userDescription: 超时请求总数。
        roles: [diagnostic]
        defaultVisibility: expert
        displayFormat: number
        displayPrecision: 0
    timeout_ratio:
      unit: ratio
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Timeout requests divided by all wrk requests.
      presentation:
        userLabel: 超时率
        userDescription: 超时请求占比。
        roles: [hard_gate]
        defaultVisibility: detail
        displayFormat: number
        displayPrecision: 4
    latency_p50_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Native Nginx request latency P50 in milliseconds.
      presentation:
        userLabel: P50 延迟
        userDescription: 请求延迟中位数。
        roles: [diagnostic]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    latency_p95_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Native Nginx request latency P95 in milliseconds.
      presentation:
        userLabel: P95 延迟
        userDescription: 请求尾延迟 P95。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    latency_p99_ms:
      unit: ms
      direction: minimize
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Native Nginx request latency P99 in milliseconds.
      presentation:
        userLabel: P99 延迟
        userDescription: 请求尾延迟 P99。
        roles: [guardrail]
        defaultVisibility: detail
        displayFormat: duration
        displayPrecision: 2
    cpu_utilization_p95:
      unit: percent
      direction: none
      kind: aggregate
      required: true
      minimumSamples: 1
      description: Host aggregate CPU utilization P95 during the native run.
      presentation:
        userLabel: CPU 利用率 P95
        userDescription: 确认测试达到 DCPerf 资源饱和条件。
        roles: [hard_gate]
        defaultVisibility: detail
        displayFormat: percent
        displayPrecision: 1
  outputs:
    maxBytes: 5368709120
    maxMetricLines: 100
    artifacts:
      - path: benchpress-result.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: native-result-enriched.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: native-system-specs.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: native-run.json
        role: raw-result
        mediaType: application/json
        required: true
      - path: benchmark.log
        role: log
        mediaType: text/plain
        required: true
      - path: native-wrk-output.log
        role: log
        mediaType: text/plain
        required: false
      - path: profile-status.txt
        role: profile
        mediaType: text/plain
        required: true
      - path: perf-record.log
        role: profile
        mediaType: text/plain
        required: false
      - path: perf.data
        role: profile
        mediaType: application/octet-stream
        required: false
      - path: result.json
        role: result
        mediaType: application/json
        required: true
  audit:
    minimumRepeats: 5
    referencePolicy: recommended
    environmentAxes: [machine, day, runtime]
    requiredEvidence: [system-fingerprint, raw-result, profile, log]
  x-extensions:
    bootstrapCatalog: true
    executionStatus: executable
    diagnosticRecommendations:
      enabled: true
      policy:
        minimumSamples: 5
        cvStable: 0.05
        cvUnstable: 0.15
        slowShareUnstable: 0.30
        outlierFenceK: 1.5
        modeMinimumSamples: 8
        modeMinR2: 0.5
        modeMinClusterShare: 0.10
        modeGapRatio: 2.5
        skewThreshold: 1.0
        associationMinCorrelation: 0.3
        associationMinLift: 1.2
        attributionMinEtaSquared: 0.25
      rules:
        - {id: dcperf.stable, scope: group, when: stable, priority: low, kind: diagnostic, action: 当前成功吞吐在合同阈值内稳定，可保持负载配置继续验证。, rationale: 通过门禁的 DCPerf 原始轮次变异系数处于稳定范围。}
        - {id: dcperf.warning, scope: group, when: warning, priority: medium, kind: retest, action: 保持 duration、scale-out 和 client threads 不变并增加重复次数。, rationale: 成功吞吐出现波动、偏度或异常轮次。}
        - {id: dcperf.unstable, scope: group, when: unstable, priority: high, kind: retest, action: 检查服务预热、CPU 饱和与后台负载后执行同配置复测。, rationale: 成功吞吐的 CV 或慢轮次占比超过 DCPerf 合同阈值。}
        - {id: dcperf.samples, scope: group, when: insufficient_evidence, priority: high, kind: retest, action: 将通过全部门禁的有效轮次补足到至少 5 次。, rationale: 当前有效吞吐样本不足。}
        - {id: dcperf.outlier, scope: group, when: outlier_present, priority: medium, kind: diagnostic, action: 展开原始终端并对照 wrk、HHVM、nginx 和系统指纹定位异常轮次。, rationale: 原始成功吞吐存在 IQR 异常值。}
        - {id: dcperf.multimodal, scope: group, when: multimodal, priority: high, kind: retest, action: 固定服务状态、CPU affinity 和频率后做分组复测。, rationale: 至少 8 个有效样本呈现疑似快慢双模式。}
        - {id: dcperf.system-metrics, scope: group, when: missing_system_metrics, priority: high, kind: data_collection, action: 补充 CPU 利用率、频率、迁移和上下文切换采集。, rationale: 缺少解释全栈吞吐波动所需的系统指标。}
        - {id: dcperf.gates, scope: group, when: gate_failure, priority: high, kind: diagnostic, action: 先排查请求核对、失败率、超时或 CPU 饱和门禁，再补测。, rationale: 未过必要门禁的轮次已从吞吐统计中排除。}
        - {id: dcperf.single-target, scope: study, when: single_target, priority: medium, kind: retest, action: 如需机型比较，请以相同 DCPerf 合同增加目标机。, rationale: 单目标结果只用于稳定性诊断，不形成性能优劣或采购结论。}
        - {id: dcperf.no-comparison, scope: study, when: no_comparison, priority: low, kind: diagnostic, action: 当前报告不输出服务器排名。, rationale: 缺少同工作负载的可比较有效证据。}
    resultPresentation:
      sections:
        - id: throughput-latency
          label: 吞吐与延迟
          description: DCPerf MediaWiki 的成功吞吐、客户端负载与原生 Nginx 尾延迟。
          metrics: [closed_loop_successful_rps, wrk_rps, latency_p50_ms, latency_p95_ms, latency_p99_ms]
        - id: validity-gates
          label: 有效性门禁
          description: 仅属于 DCPerf 闭环场景的失败、超时与 CPU 饱和证据。
          metrics: [failed_request_ratio, error_ratio, timeout_count, timeout_ratio, cpu_utilization_p95]
    selectionDefaults: {repeats: 5, timeoutSeconds: 86400, seed: 20260306}
    sourceLock: source-lock.json
    includesClientWork: true
    supportedHost: Ubuntu 22.04 x86_64; Ubuntu 24.04 x86_64 compatibility candidate with smoke validation required
    unsupportedHostReason: Non-Ubuntu distributions, unsupported Ubuntu releases, and non-x86_64 hosts are rejected by prepare.py before installation.
    nativeSourceArchive: dependency-lock.json
